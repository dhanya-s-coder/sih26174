name: "Smart India Hackathon BAS Experiment"
version: "2.0.0"
steps:
  - id: "step_001"
    name: "Main Box Present"
    instruction: "The main box is ready. Take out the yellow box."
    position: 1
    required_predicates:
      - type: "object_present"
        args: ["main_box"]
    expected_outcome: "Main box is present and the experiment can begin."

  - id: "step_002"
    name: "Take Out Yellow Box"
    instruction: "Take the yellow box out of the main box."
    position: 2
    required_predicates:
      - type: "object_removed"
        args: ["yellow_box", "main_box"]
    expected_outcome: "Yellow box has been removed from the main box."

  - id: "step_003"
    name: "Place Yellow Box Left"
    instruction: "Place the yellow box on the left."
    position: 3
    required_predicates:
      - type: "object_placed"
        args: ["yellow_box", "left"]
    expected_outcome: "Yellow box is placed on the left."

  - id: "step_004"
    name: "Take Out Red Box"
    instruction: "Take the red box out of the main box."
    position: 4
    required_predicates:
      - type: "object_removed"
        args: ["red_box", "main_box"]
    expected_outcome: "Red box has been removed from the main box."

  - id: "step_005"
    name: "Place Red Box Right"
    instruction: "Place the red box on the right."
    position: 5
    required_predicates:
      - type: "object_placed"
        args: ["red_box", "right"]
    expected_outcome: "Red box is placed on the right."
